# Runs Mesa as a service next to a PostgreSQL you can point it at.
#   MESA_APP_KEY=$(openssl rand -base64 32) docker compose up --build
# Then open http://localhost:8080 and add a connection to host "postgres",
# user "mesa", password "mesa", database "mesa".
services:
  mesa:
    build: .
    image: mesa:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MESA_APP_KEY: ${MESA_APP_KEY:?set MESA_APP_KEY (mesa key, or openssl rand -base64 32)}
      MESA_STORE: sqlite
      MESA_STORE_DSN: /data/mesa.db
      MESA_LOG_LEVEL: info
    volumes:
      - mesa_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: mesa
      POSTGRES_DB: mesa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mesa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mesa_data:
  postgres_data:
