apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mesa.fullname" . }}
  labels: {{ include "mesa.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.config.store "sqlite" }}
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{ include "mesa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "mesa.selectorLabels" . | nindent 8 }}
    spec:
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mesa
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MESA_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret | default (include "mesa.fullname" .) }}
                  key: MESA_APP_KEY
            - name: MESA_LISTEN
              value: ":8080"
            - name: MESA_STORE
              value: {{ .Values.config.store | quote }}
            - name: MESA_STORE_DSN
              value: {{ .Values.config.storeDSN | quote }}
            - name: MESA_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: MESA_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- if eq .Values.config.store "sqlite" }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if eq .Values.config.store "sqlite" }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mesa.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
