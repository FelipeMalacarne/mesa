name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mesa
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmesa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Test
        run: go test ./...
        env:
          MESA_TEST_PG: postgres://postgres@localhost:5432/postgres?sslmode=disable
          MESA_TEST_MYSQL: root:mesa@tcp(127.0.0.1:3306)/

  platform:
    # The updater and deep-link code swap executables and app bundles, which
    # behaves differently per OS: run its tests where it ships.
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/platform/... ./internal/core/...

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Native libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build mesa-desktop
        run: make desktop

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=ci

  macos-install:
    # A real Mac: install the latest release with the script people use,
    # start the app, and keep a screenshot of its window.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install with packaging/darwin/install.sh
        env:
          MESA_INSTALL_DIR: ${{ runner.temp }}/Applications
          MESA_NO_OPEN: "1"
        run: sh packaging/darwin/install.sh
      - name: Start Mesa and capture its window
        run: |
          app="$RUNNER_TEMP/Applications/Mesa.app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/mesa-desktop"
          MESA_HOME="$RUNNER_TEMP/mesa-home" MESA_UPDATE_CHECK=off "$app/Contents/MacOS/mesa-desktop" > "$RUNNER_TEMP/mesa.log" 2>&1 &
          pid=$!
          sleep 20
          screencapture -x "$RUNNER_TEMP/mesa-macos.png" || true
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Mesa exited early:"; cat "$RUNNER_TEMP/mesa.log"; exit 1
          fi
          kill "$pid"
          cat "$RUNNER_TEMP/mesa.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-install
          path: |
            ${{ runner.temp }}/mesa-macos.png
            ${{ runner.temp }}/mesa.log
