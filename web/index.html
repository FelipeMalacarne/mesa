<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Mesa — the SQL control plane" />
    <title>Mesa</title>
    <script>
      // Apply the stored theme before paint. Dark is the default; see src/app/theme.ts.
      (function () {
        var t = "dark";
        try {
          t = localStorage.getItem("mesa.theme") === "light" ? "light" : "dark";
        } catch (e) {}
        var el = document.documentElement;
        el.classList.toggle("dark", t === "dark");
        el.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
