{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mesa.fullname" . }}
  labels: {{ include "mesa.labels" . | nindent 4 }}
type: Opaque
stringData:
  MESA_APP_KEY: {{ required "config.appKey is required (or set config.existingSecret)" .Values.config.appKey | quote }}
{{- end }}
